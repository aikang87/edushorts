services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
      - ~/models:/models
    ports:
      - "11434:11434"
  chat:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./app:/app
    environment:
      - OLLAMA_HOST=http://ollama:11434
    profiles: ["tools"]

volumes:
  ollama:
